[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "vibrastruct"
version = "1.1.0"
description = "Educational linear structural dynamics and vibration analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.6,<4"]
[tool.setuptools.packages.find]
include = ["vibrastruct*"]
